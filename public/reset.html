<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TileSpree · unlink wallet</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23f23a12'/%3E%3Ctext x='32' y='47' font-family='Arial Black,Arial,sans-serif' font-size='46' font-weight='900' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
<style>
  body{margin:0;background:#fbfaf8;color:#15130f;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid #ece8e1;border-radius:20px;padding:30px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  h1{font-size:22px;margin:0 0 6px}.sub{color:#8b857c;margin:0 0 22px;font-size:14px}
  button{background:#f23a12;color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:700;width:100%;cursor:pointer}
  button:disabled{opacity:.5}
  .warn{background:rgba(210,85,63,.08);color:#b23;border-radius:10px;padding:11px 13px;font-size:13px;margin:0 0 18px;text-align:left}
  .st{margin-top:16px;font-size:14px;min-height:20px}.ok{color:#1f9d63}
  a{color:#f23a12}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">Unlink</h1>
  <p class="sub" id="sub"></p>
  <div class="warn" id="warn"></div>
  <button id="go"></button>
  <div class="st" id="st"></div>
</div>
<script>
const $=s=>document.querySelector(s);
// This device holds the wallet only if the passkey/key live here (the phone).
const hasWallet = !!(localStorage.getItem("tilespree.deviceKey") || localStorage.getItem("tilespree.credId"));
if(hasWallet){
  $("#title").textContent = "Flush this wallet";
  $("#sub").textContent = "This phone holds your passkey + wallet key. Flushing lets you sign up fresh.";
  $("#warn").innerHTML = "⚠️ The on-device wallet key will be permanently flushed. If you didn't back it up, that wallet/address is gone. Your published research tiles stay on the server.";
  $("#go").textContent = "Flush wallet on this device";
} else {
  $("#title").textContent = "Sign out this browser";
  $("#sub").textContent = "This browser only holds a session, not your wallet key.";
  $("#warn").innerHTML = "ℹ️ This just signs out here. To fully flush your wallet, open <b>/reset on your phone</b> (where the key lives).";
  $("#go").textContent = "Sign out this browser";
}
$("#go").onclick=()=>{
  ["tilespree.credId","tilespree.deviceKey","tilespree.address","tilespree.previews"].forEach(k=>localStorage.removeItem(k));
  $("#st").innerHTML = '<span class="ok">'+(hasWallet?"Wallet flushed ✓":"Signed out ✓")+' — <a href="/">go to TileSpree →</a></span>';
  $("#go").disabled=true;
};
</script>
</body>
</html>
