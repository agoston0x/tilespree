<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TileSpree · sign in</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23f23a12'/%3E%3Ctext x='32' y='47' font-family='Arial Black,Arial,sans-serif' font-size='46' font-weight='900' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
<style>
  body{margin:0;background:#fbfaf8;color:#15130f;font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
    display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px}
  .card{background:#fff;border:1px solid #ece8e1;border-radius:20px;padding:30px;max-width:420px;width:100%;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)}
  h1{font-size:22px;margin:0 0 6px}.sub{color:#8b857c;margin:0 0 22px;font-size:14px}
  button{background:#f23a12;color:#fff;border:0;border-radius:12px;padding:16px;font-size:16px;font-weight:700;width:100%;cursor:pointer}
  button:disabled{opacity:.5}
  .st{margin-top:16px;font-size:14px;min-height:20px}.err{color:#d2553f}.ok{color:#1f9d63}
  .addr{margin-top:14px;font-family:ui-monospace,Menlo,monospace;font-size:12px;color:#8b857c;word-break:break-all}
  .mode{margin-top:10px;font-size:12px;color:#8b857c}
</style>
</head>
<body>
<div class="card">
  <h1>Sign in to TileSpree</h1>
  <p class="sub">Continue with your device passkey. We derive a self-custody wallet on this phone — your key never leaves it.</p>
  <button id="go">🔑 Continue with passkey</button>
  <button id="fund" style="display:none;margin-top:12px;background:#fff;color:#f23a12;border:1px solid #ece8e1">💵 Fund & authorize spending</button>
  <div class="st" id="st"></div>
  <div class="addr" id="addr"></div>
  <div class="mode" id="mode"></div>
</div>
<script src="/ethers.js"></script>
<script src="/passkey-wallet.js"></script>
<script>
const $=s=>document.querySelector(s);
const st=(m,c="")=>$("#st").innerHTML=`<span class="${c}">${m}</span>`;
const sid=new URLSearchParams(location.search).get("sid");
if(!sid) st("Missing session — rescan the QR on your desktop.","err");
if(!window.isSecureContext) st("Passkeys need HTTPS — open this page over https.","err");

$("#go").onclick=async()=>{
  if(!sid)return; $("#go").disabled=true;
  try{
    st("Complete the passkey prompt…");
    const { address, sig, message, mode } = await window.PasskeyWallet.connect(sid);
    $("#addr").textContent = address;
    $("#mode").textContent = mode==="passkey-prf" ? "🔒 key derived from your passkey (PRF)" : "🔑 device key (passkey PRF unavailable)";
    st("Linking to your desktop…");
    const r = await (await fetch(`/api/session/${sid}/claim`,{method:"POST",headers:{"content-type":"application/json"},
      body:JSON.stringify({ address, sig, message })})).json();
    if(r.error) throw new Error(r.error);
    st("Signed in ✓ — you have free searches on your desktop.","ok");
    // Offer funding/authorization for paid searches (only if the chain is configured).
    const cfg = await (await fetch("/api/chain/config")).json();
    if(cfg.configured){ window.__cfg=cfg; $("#fund").style.display="block"; }
    else { st("Signed in ✓ — return to your desktop.","ok"); }
  }catch(e){ st("Failed: "+(e.message||e),"err"); $("#go").disabled=false; }
};

$("#fund").onclick=async()=>{
  const cfg=window.__cfg; if(!cfg)return; $("#fund").disabled=true;
  try{
    const addr=$("#addr").textContent;
    st("Minting test USDC + gas…");
    const f=await (await fetch("/api/faucet",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({address:addr})})).json();
    if(f.error) throw new Error(f.error);
    st("Approve the app to spend your USDC…");
    const a=await window.PasskeyWallet.approveSpend(cfg);
    st(`Ready ✓ — ${f.usdc} USDC funded${a.already?"":" & spending authorized"}. Return to your desktop.`,"ok");
    $("#fund").style.display="none";
  }catch(e){ st("Funding failed: "+(e.message||e),"err"); $("#fund").disabled=false; }
};
</script>
</body>
</html>
