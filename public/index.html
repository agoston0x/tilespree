<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>tile spree</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23f23a12'/%3E%3Ctext x='32' y='47' font-family='Arial Black,Arial,sans-serif' font-size='46' font-weight='900' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#fbfaf8; --card:#ffffff; --ink:#15130f; --muted:#8b857c;
    --line:#ece8e1; --accent:#f23a12; --ok:#1f9d63; --skip:#b9b3a8; --err:#d2553f;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif}
  a{color:var(--accent)}
  .hidden{display:none!important}
  /* sticky bar */
  .topbar{position:sticky;top:0;z-index:50;background:rgba(251,250,248,.85);
    backdrop-filter:saturate(180%) blur(10px);border-bottom:1px solid var(--line);
    display:flex;align-items:center;gap:14px;padding:11px 20px}
  .brand{display:flex;align-items:center;gap:10px}
  .brand .tag{font-size:11px;color:var(--accent);background:rgba(242,58,18,.08);border-radius:6px;padding:2px 7px}
  /* enamel-sign logo (recreated from tilespree.png) */
  .logo{position:relative;background:#f23a12;border-radius:5px;padding:7px 14px 9px;line-height:.82;
    transform:perspective(460px) rotateY(-17deg) rotate(-1deg);transform-origin:left center;
    box-shadow:0 5px 16px rgba(242,58,18,.34)}
  .logo span{display:block;color:#fff;font-family:"Arial Black","Helvetica Neue",Arial,sans-serif;
    font-weight:900;letter-spacing:-.01em;text-shadow:0 1px 0 rgba(0,0,0,.14)}
  .logo span b{display:inline-block}            /* letters straight, just inline */
  .logo .l1{font-size:18px}
  .logo .l2{font-size:20px}
  .logo i{position:absolute;width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .logo .b1{top:5px;right:7px}.logo .b2{bottom:6px;left:7px}
  .logo .b3{bottom:6px;right:7px;background:#bfe34a;box-shadow:0 0 0 1.5px #fff}   /* moved off the text */
  .spacer{flex:1}
  .chip{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;color:var(--muted);line-height:1.25}
  .chip b{font-size:14px;color:var(--ink);font-weight:620}
  .chip.spent b{color:var(--err)} .chip.left b{color:var(--ok)} .chip.locked b{color:#c98a14}
  .topgroup{display:flex;align-items:center;gap:12px}
  .freebadge{font-size:12px;font-weight:600;color:var(--accent);background:rgba(242,58,18,.08);border-radius:8px;padding:5px 10px}
  .signin{padding:8px 14px;font-size:13px;border-radius:9px}
  @media(max-width:600px){.chip span{display:none}.chip b{font-size:13px}.topgroup{gap:8px}}
  .wrap{width:100%;max-width:1040px;margin:0 auto;padding:26px 22px 90px}
  .sub{color:var(--muted);margin:0 0 22px;font-size:14px;text-align:center}
  .narrow{max-width:760px;margin-left:auto;margin-right:auto}
  /* hero */
  .hero-title{font-size:54px;font-weight:820;letter-spacing:-.04em;text-align:center;margin:18px 0 6px;
    background:linear-gradient(120deg,#f23a12,#ff7a3c 70%);-webkit-background-clip:text;background-clip:text;color:transparent}
  @media(max-width:600px){.hero-title{font-size:40px}}
  .hero-search{max-width:680px;margin:14px auto 30px}
  /* auth modal */
  .authwrap{position:fixed;inset:0;z-index:110;background:rgba(15,19,15,.62);backdrop-filter:blur(5px);
    display:none;align-items:center;justify-content:center;padding:24px}
  .authwrap.on{display:flex}
  .authcard{background:#fff;border-radius:20px;padding:30px;max-width:420px;width:100%;text-align:center;box-shadow:0 24px 70px rgba(0,0,0,.35)}
  .authcard h2{font-size:22px;margin:0 0 6px;letter-spacing:-.02em}
  .authcard p{color:var(--muted);font-size:14px;margin:0 0 20px}
  .authcard .big{width:100%;padding:15px;font-size:16px}
  .authcard .skip{margin-top:12px;background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;font-weight:500}
  .authcard .st{margin-top:14px;font-size:13px;min-height:18px}.authcard .st .err{color:var(--err)}.authcard .st .ok{color:var(--ok)}
  .qrbox{width:232px;height:232px;margin:4px auto 16px;display:grid;place-items:center;border:1px solid var(--line);border-radius:14px;background:#fff}
  .qrbox img{width:216px;height:216px;border-radius:6px}
  .hero-search .row{gap:10px}
  #q{padding:16px 18px;font-size:17px;border-radius:13px}
  #q::placeholder{color:#bdb7ac;transition:opacity .3s}
  #q.phfade::placeholder{opacity:0}
  #go{padding:16px 22px;font-size:16px}
  /* past-search grid — full width, max 4/row */
  .hist-head{margin:6px 0 14px}.hist-head h3{margin:0}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}            /* mobile-first: 2/row */
  @media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);gap:14px}} /* desktop: 4/row */
  .tile{position:relative;aspect-ratio:1/1;border:1px solid var(--line);border-radius:16px;overflow:hidden;
    cursor:pointer;background:#fff;display:flex;flex-direction:column;justify-content:flex-end;
    transition:transform .12s,box-shadow .12s}
  .tile:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(0,0,0,.12)}
  .tile .thumb{position:absolute;inset:0;background-size:cover;background-position:center}
  .tile .thumb.grad{background:linear-gradient(135deg,#f23a12,#ff8a3d 60%,#ffb05a)}
  .tile .veil{position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,6,.8),rgba(10,8,6,.05) 64%)}
  .tile .q{position:relative;z-index:2;color:#fff;padding:12px 13px 2px;font-size:14px;font-weight:600;line-height:1.3;
    display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .tile .meta{position:relative;z-index:2;color:rgba(255,255,255,.82);font-size:11px;padding:5px 13px 13px}
  /* cards / inputs */
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
  .row{display:flex;gap:10px}
  input{flex:1;border:1px solid var(--line);border-radius:11px;padding:13px 14px;font-size:15px;outline:none}
  input:focus{border-color:var(--accent)}
  button{background:var(--accent);color:#fff;border:0;border-radius:11px;padding:13px 18px;
    font-size:15px;font-weight:600;cursor:pointer;transition:opacity .15s,transform .05s}
  button:disabled{opacity:.45;cursor:default}
  button.ghost{background:#fff;color:var(--accent);border:1px solid var(--line)}
  button:active:not(:disabled){transform:translateY(1px)}
  .back{margin-bottom:14px}
  /* timeline */
  .timeline{list-style:none;margin:0;padding:0}
  .step{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);opacity:.35;transition:opacity .35s}
  .step:first-child{border-top:0}.step.live{opacity:1}
  .dot{flex:0 0 22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:#f0eee9;color:var(--skip);margin-top:1px}
  .step.ok .dot{background:rgba(31,157,99,.13);color:var(--ok)}
  .step.error .dot{background:rgba(210,85,63,.13);color:var(--err)}
  .step .label{font-weight:560}
  .step .detail{color:var(--muted);font-size:13px;margin-top:2px}
  .step .art{font-size:12px;color:var(--muted);margin-top:4px;word-break:break-all}
  /* findings */
  .answer{white-space:pre-wrap;font-size:15px;line-height:1.65}
  h3{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 8px}
  .srcs{list-style:none;padding:0;margin:0}
  .srcs li{padding:7px 0;border-top:1px solid var(--line);font-size:14px}
  .srcs a{text-decoration:none;font-weight:540}.srcs .u{display:block;color:var(--muted);font-size:12px;margin-top:1px}
  .findings{position:relative}
  .findings.clamped{max-height:130px;overflow:hidden}
  .findings.clamped::after{content:"";position:absolute;left:0;right:0;bottom:0;height:80px;background:linear-gradient(transparent,#fff)}
  .showmore{margin-top:12px}
  /* result layout: deck above findings when opened from a tile */
  #result{display:flex;flex-direction:column}
  #result #backBtn{order:0}#result #flow{order:1}#result #answerCard{order:2}#result #deckSection{order:3}
  #result.deck-top #deckSection{order:1}#result.deck-top #answerCard{order:2}
  /* deck section */
  #deckSection{margin-bottom:16px}
  .deckph{height:440px;border:1.5px dashed #d8d2c8;border-radius:18px;display:grid;place-items:center;text-align:center;
    background:linear-gradient(135deg,rgba(91,83,255,.05),rgba(210,85,63,.05))}
  .deckph .cta b{display:block;font-size:16px;color:var(--ink);margin-bottom:4px;font-weight:640}
  .deckph .cta span{display:block;color:var(--muted);font-size:13px;margin-bottom:16px}
  .deckwrap{position:relative;height:min(46vh,420px);min-height:260px;border:1px solid var(--line);border-radius:18px;overflow:hidden;
    background:#fff;display:flex;flex-direction:column;box-shadow:0 1px 2px rgba(0,0,0,.03);transition:box-shadow .2s}
  .deckwrap.maximized{position:fixed;inset:3vh 2vw;height:auto;z-index:95;box-shadow:0 24px 70px rgba(0,0,0,.4)}
  #backdrop{position:fixed;inset:0;background:rgba(15,19,15,.6);backdrop-filter:blur(4px);z-index:94;display:none}
  #backdrop.show{display:block}
  .iconbtn{position:absolute;top:12px;z-index:6;background:rgba(255,255,255,.92);color:var(--ink);
    border:1px solid var(--line);border-radius:9px;width:34px;height:34px;padding:0;font-size:15px;cursor:pointer}
  .mx{right:12px}.dclose{right:12px;display:none}
  .deckwrap.maximized .mx{display:none}.deckwrap.maximized .dclose{display:block}
  /* slideshow */
  .deck{position:relative;overflow:hidden;background:#fff;flex:1;display:flex;flex-direction:column}
  .slides{display:flex;transition:transform .35s ease;flex:1;min-height:0}
  .slide{min-width:100%;padding:34px 44px;overflow-y:auto}
  .slide h2{font-size:25px;margin:0 0 12px;letter-spacing:-.02em;line-height:1.15}
  .slide p{color:#3b372f;font-size:14px;line-height:1.6;margin:0 0 12px}
  .slide img.hero{width:100%;height:230px;object-fit:cover;border-radius:12px;background:#f0eee9;margin-bottom:18px;cursor:zoom-in}
  .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);font-weight:640}
  .nav{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line)}
  .nav .dots{display:flex;gap:5px}.nav .d{width:6px;height:6px;border-radius:50%;background:var(--line)}.nav .d.on{background:var(--accent)}
  .tree{font-size:14px}.tree .root{font-weight:640;margin-bottom:6px}
  .tree .branch{padding:5px 0 5px 16px;border-left:2px solid var(--line);margin-left:6px}
  .tree .branch a{text-decoration:none;font-weight:540}.tree .branch .u{color:var(--muted);font-size:12px}
  .imgrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.imgrow img{width:72px;height:54px;object-fit:cover;border-radius:7px;cursor:zoom-in}
  .slide .pts{list-style:none;padding:0;margin:6px 0 0}
  .slide .pts li{position:relative;padding:7px 0 7px 20px;font-size:14px;line-height:1.55;border-top:1px solid var(--line)}
  .slide .pts li:first-child{border-top:0}
  .slide .pts li::before{content:"";position:absolute;left:2px;top:14px;width:7px;height:7px;border-radius:2px;background:var(--accent)}
  .slide .twocol{column-count:2;column-gap:18px}
  .slide .lead{font-size:15px;color:#3b372f;font-weight:540;margin:0 0 10px}
  .slide .callout{background:rgba(91,83,255,.06);border-left:3px solid var(--accent);border-radius:8px;padding:10px 12px;font-size:13.5px;color:#3b372f;margin-top:12px}
  .slide a.src{display:inline-block;margin-top:12px;font-weight:560;text-decoration:none}
  /* lightbox */
  .lb{position:fixed;inset:0;z-index:120;background:rgba(15,19,15,.86);display:none;align-items:center;justify-content:center;padding:30px;cursor:zoom-out}
  .lb.on{display:flex}.lb img{max-width:92vw;max-height:90vh;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">
    <div class="logo" title="tile spree"><span class="l1"><b>t</b><b>i</b><b>l</b><b>e</b></span><span class="l2"><b>s</b><b>p</b><b>r</b><b>e</b><b>e</b></span><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>
  </div>
  <div class="spacer"></div>
  <div id="guestBar" class="topgroup">
    <span class="freebadge" id="freeBadge">3 free searches</span>
    <button id="signInBtn" class="signin">Sign in</button>
  </div>
  <div id="userBar" class="topgroup hidden">
    <div class="chip"><span>Free left</span><b id="freeLeft">3</b></div>
    <div class="chip left"><span>Wallet</span><b id="walletBal">—</b></div>
    <div class="chip locked"><span>Escrow</span><b id="escrowBal">0.00 USDC</b></div>
  </div>
</div>

<div class="wrap">
  <!-- LANDER -->
  <div id="lander">
    <div class="hero-search">
      <div class="row">
        <input id="q" placeholder="Research anything…" autocomplete="off" />
        <button id="go">Run</button>
      </div>
    </div>
    <div class="hidden" id="history">
      <div class="hist-head"><h3>Explore research</h3></div>
      <div class="grid" id="grid"></div>
    </div>
  </div>

  <!-- RESULT -->
  <div id="result" class="hidden">
    <button class="ghost back" id="backBtn">‹ Back to research</button>

    <div class="card hidden narrow" id="flow"><ul class="timeline" id="timeline"></ul></div>

    <div class="card narrow hidden" id="answerCard">
      <div class="findings" id="findings">
        <div class="answer" id="answer"></div>
        <h3 id="srcHead" class="hidden">Sources</h3>
        <ul class="srcs" id="sources"></ul>
      </div>
      <button class="ghost showmore hidden" id="showMore">Show more</button>
    </div>

    <div id="deckSection" class="hidden">
      <div class="deckph" id="deckph">
        <div class="cta">
          <b>Presentation deck</b>
          <span>Turn these findings into a slideshow with images &amp; source map.</span>
          <button id="genDeck">✨ Generate deck</button>
        </div>
      </div>
      <div class="deckwrap hidden" id="deckwrap">
        <button class="iconbtn mx" id="mxBtn" title="Maximize">⛶</button>
        <button class="iconbtn dclose" id="closeDeck" title="Close">✕</button>
        <div class="deck">
          <div class="slides" id="slides"></div>
          <div class="nav">
            <button class="ghost" id="prev">‹ Prev</button>
            <div class="dots" id="dots"></div>
            <button class="ghost" id="next">Next ›</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="backdrop"></div>
<div class="lb" id="lb"><img id="lbImg" alt=""></div>

<div class="authwrap" id="authModal">
  <div class="authcard">
    <h2>Scan to sign in</h2>
    <p>Scan with your phone &amp; continue with a passkey. First 3 runs free.</p>
    <div class="qrbox" id="qrBox"></div>
    <button class="skip" id="authClose">Maybe later</button>
    <div class="st" id="authSt"></div>
  </div>
</div>

<script src="/w3s.js"></script>

<script>
const $ = (s) => document.querySelector(s);
const go = $("#go"), tl = $("#timeline");
let LAST = null, deckData = null;
window.__lastErr = "";
window.addEventListener("error", e => { window.__lastErr = (e.message||"") + (e.filename ? " @ "+e.filename.split("/").pop() : ""); });

const fmt = (n) => `${Number(n).toFixed(2)} USDC`;
const linkify = (v) => String(v).startsWith("http") ? `<a href="${v}" target="_blank" rel="noopener">${v}</a>` : v;
const setBal = (b) => {
  if (b.locked != null) $("#escrowBal").textContent = fmt(b.locked);
  if (b.remaining != null) $("#walletBal").textContent = fmt(b.remaining);
};
// Top-bar auth/free state: guest (3 free + Sign in) vs signed-in (free left, wallet, escrow).
function updateAuthUI(){
  const used = +(localStorage.getItem("tilespree.freeUsed")||0);
  const left = Math.max(0, 3 - used);
  if (signedIn()){
    $("#guestBar").classList.add("hidden"); $("#userBar").classList.remove("hidden");
    $("#freeLeft").textContent = left;
    fetch("/api/ucw/balance/"+userId).then(r=>r.json()).then(b=>{ if(b&&b.balance!=null) $("#walletBal").textContent = fmt(b.balance); }).catch(()=>{});
  } else {
    $("#userBar").classList.add("hidden"); $("#guestBar").classList.remove("hidden");
    $("#freeBadge").textContent = left + " free searches";
  }
}
const esc = (s)=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const host = (u)=>{try{return new URL(u).hostname.replace(/^www\./,"");}catch{return u;}};
const ago = (ts)=>{const s=(Date.now()-ts)/1000;
  return s<60?"just now":s<3600?Math.floor(s/60)+"m ago":s<86400?Math.floor(s/3600)+"h ago":Math.floor(s/86400)+"d ago";};

// ---- Views ----
function setView(v, sy){
  $("#lander").classList.toggle("hidden", v!=="lander");
  $("#result").classList.toggle("hidden", v!=="result");
  if (v==="lander") { restoreDeck(); renderHistory(); window.scrollTo({ top: sy ?? 0, behavior: sy!=null?"auto":"smooth" }); }
}
$("#backBtn").onclick = () => setView("lander");

// (top-bar state set by updateAuthUI() on load — see bottom of script)

// ---- Render findings + deck section ----
function showResult(d, opts){
  opts = opts || {};
  LAST = d; deckData = d;
  $("#answer").innerHTML = citeHtml(d.result || "", d.sources || []);
  const ul = $("#sources"); ul.innerHTML = "";
  (d.sources||[]).forEach((s,i)=>{
    const li=document.createElement("li");
    li.innerHTML=`<a href="${s.url}" target="_blank" rel="noopener">[${i+1}] ${esc(s.title)}</a><span class="u">${esc(s.url)}</span>`;
    ul.appendChild(li);
  });
  const hasSrc=(d.sources||[]).length;
  $("#srcHead").classList.toggle("hidden", !hasSrc);
  $("#flow").classList.toggle("hidden", !opts.live); // timeline only for live runs
  $("#answerCard").classList.remove("hidden");
  // clamp findings (default when opened from a tile)
  const clamp = !!opts.clamp;
  $("#findings").classList.toggle("clamped", clamp);
  $("#showMore").classList.toggle("hidden", !clamp);
  $("#showMore").textContent = "Show more";
  // deck section: placeholder by default; auto-build inline when opening a tile
  $("#deckSection").classList.toggle("hidden", !hasSrc);
  $("#result").classList.toggle("deck-top", !!opts.autoDeck); // slideshow above findings on tile-open
  resetDeckToPlaceholder();
  if (opts.autoDeck && hasSrc) { buildDeck(d); }
  setView("result");
}
$("#showMore").onclick = () => {
  if (!signedIn()) { openAuth(); return; }   // expanding full findings requires sign-in
  const c = $("#findings").classList.toggle("clamped");
  $("#showMore").textContent = c ? "Show more" : "Show less";
};

// ---- Past-search tiles (server / SQLite) ----
async function renderHistory(){
  let arr=[];
  try { arr = await (await fetch("/api/searches")).json(); } catch {}
  $("#history").classList.toggle("hidden", !(arr&&arr.length));
  $("#grid").innerHTML = (arr||[]).map((it)=>{
    const img = it.images && it.images[0] && it.images[0].url;
    const thumb = img?`<div class="thumb" style="background-image:url('${img}')"></div>`:`<div class="thumb grad"></div>`;
    const spent = it.economics?fmt(it.economics.spent):"—";
    return `<div class="tile" data-id="${it.id}">${thumb}<div class="veil"></div>
      <div class="q">${esc(it.query)}</div><div class="meta">${ago(it.ts)} · ${spent}</div></div>`;
  }).join("");
}
let cameFromTile=false, landerScrollY=0;
async function openTile(id){
  try { const it=await (await fetch("/api/searches/"+id)).json();
    if(it&&it.result) showResult(it,{clamp:true,autoDeck:true}); } catch {}
}
$("#grid").addEventListener("click",(e)=>{
  const t=e.target.closest(".tile"); if(!t)return;
  landerScrollY=window.scrollY; cameFromTile=true;   // remember where we were
  openTile(t.dataset.id);
});

// ---- Cycling placeholder ----
const PROMPTS=["What is the history of…","The development role of…","List every instance of…",
  "Compare the approaches to…","Trace the origins of…","Why did … happen?",
  "What are the latest breakthroughs in…","Who are the key players in…",
  "Explain how … actually works","Map the landscape of…"];
const qEl=$("#q"); let pi=0; qEl.placeholder=PROMPTS[0];
setInterval(()=>{ if(qEl.value||document.activeElement===qEl)return;
  qEl.classList.add("phfade");
  setTimeout(()=>{pi=(pi+1)%PROMPTS.length;qEl.placeholder=PROMPTS[pi];qEl.classList.remove("phfade");},300);
},2800);

// ---- Auth gate (passkey) ----
const USERKEY="tilespree.userId";
let userId = localStorage.getItem(USERKEY);
const signedIn = () => !!localStorage.getItem("tilespree.signedin");
let previewed = false, pendingAction = null;
function gateTile(fn){ if(signedIn())return fn(); if(!previewed){previewed=true;return fn();} pendingAction=fn; openAuth(); }
function gateRun(fn){ if(signedIn())return fn(); pendingAction=fn; openAuth(); }
const authSt=(m,c="")=>$("#authSt").innerHTML=`<span class="${c}">${m}</span>`;
let pollTimer=null;
function openAuth(){ authSt(""); $("#qrBox").innerHTML=""; $("#authModal").classList.add("on"); startQrLogin(); }
function closeAuth(){ $("#authModal").classList.remove("on"); if(pollTimer){clearInterval(pollTimer);pollTimer=null;} }
$("#authClose").onclick = closeAuth;
$("#signInBtn").onclick = openAuth;
$("#authModal").addEventListener("click",e=>{ if(e.target.id==="authModal")closeAuth(); });
function finishAuth(uid){
  if(uid){ userId=uid; localStorage.setItem(USERKEY,uid); }
  localStorage.setItem("tilespree.signedin", userId);
  authSt("You're in ✓","ok"); updateAuthUI();
  setTimeout(()=>{ closeAuth(); const a=pendingAction; pendingAction=null; if(a)a(); }, 700);
}
// Desktop shows a QR to the phone; phone completes the passkey and claims the session.
async function startQrLogin(){
  try{
    const s = await (await fetch("/api/session/new",{method:"POST"})).json();
    const url = s.mobileUrl.startsWith("http") ? s.mobileUrl : (location.origin + s.mobileUrl);
    $("#qrBox").innerHTML = `<img alt="Scan to sign in" src="https://api.qrserver.com/v1/create-qr-code/?size=216x216&margin=6&data=${encodeURIComponent(url)}">`;
    authSt(s.hasBase ? "Scan with your phone to continue" : `Set PUBLIC_BASE_URL (tunnel) so a phone can reach this · <a href="${url}" target="_blank">open on this device</a>`);
    pollTimer = setInterval(async()=>{
      try{ const r = await (await fetch("/api/session/"+s.sid)).json();
        if(r.status==="authed"){ clearInterval(pollTimer); pollTimer=null; finishAuth(r.userId); } }catch{}
    }, 1600);
  }catch(e){ authSt("Error: "+e.message,"err"); }
}

// ---- Run a query ----
function doRun(q){
  go.disabled=true; tl.innerHTML="";
  setView("result");
  $("#flow").classList.remove("hidden");
  $("#answerCard").classList.add("hidden");
  $("#deckSection").classList.add("hidden");

  const es=new EventSource("/api/run?q="+encodeURIComponent(q));
  es.addEventListener("balance",(e)=>setBal(JSON.parse(e.data)));
  es.addEventListener("step",(e)=>{
    const s=JSON.parse(e.data);
    const li=document.createElement("li");
    li.className="step live "+s.status;
    const icon=s.status==="ok"?"✓":s.status==="error"?"!":"–";
    const art=s.artifact?Object.entries(s.artifact).map(([k,v])=>`<div class="art">${k}: ${linkify(v)}</div>`).join(""):"";
    li.innerHTML=`<div class="dot">${icon}</div><div><div class="label">${s.label}</div>${s.detail?`<div class="detail">${s.detail}</div>`:""}${art}</div>`;
    tl.appendChild(li); li.scrollIntoView({behavior:"smooth",block:"end"});
  });
  es.addEventListener("done",(e)=>{
    const d=JSON.parse(e.data);
    if(d.economics){ $("#walletBal").textContent=fmt(d.economics.remaining); $("#escrowBal").textContent=fmt(0); }
    const used=+(localStorage.getItem("tilespree.freeUsed")||0)+1; localStorage.setItem("tilespree.freeUsed",used); updateAuthUI();
    if(d.result){ showResult(d,{clamp:false,autoDeck:false,live:true}); setTimeout(()=>$("#deckSection").scrollIntoView({behavior:"smooth",block:"center"}),150); }
    es.close(); go.disabled=false;
  });
  es.addEventListener("fatal",(e)=>{ $("#answer").textContent="Error: "+(JSON.parse(e.data).error||"unknown"); $("#answerCard").classList.remove("hidden"); es.close(); go.disabled=false; });
  es.onerror=()=>{ es.close(); go.disabled=false; };
}
go.onclick = () => { const q=qEl.value.trim(); if(!q)return; gateRun(()=>doRun(q)); };

// ---- Citations + slide helpers ----
function citeHtml(text,sources){
  return esc(text).replace(/\[(\d+)\]/g,(m,n)=>{const s=sources[+n-1];
    return s?`<a href="${s.url}" target="_blank" rel="noopener">[${n}]</a>`:m;});
}
function toPoints(text){
  return String(text).split(/\n+/).map(l=>l.replace(/^\s*([*\-•]|\d+[.)])\s*/,"").trim()).filter(l=>l.length>2);
}

// ---- Deck (placeholder ↔ inline ↔ maximized) ----
function resetDeckToPlaceholder(){
  $("#deckph").classList.remove("hidden");
  $("#deckwrap").classList.add("hidden");
  restoreDeck();
}
$("#genDeck").onclick = () => { if(deckData){ buildDeck(deckData); } };

let idx=0, count=0;
function buildDeck(d){
  const sources=d.sources||[], images=(d.images||[]).map(i=>i.url);
  const pts=toPoints(d.result||"");
  const slides=[];
  slides.push(`<div class="slide"><div class="kicker">Research Findings</div>
    <h2>${esc(d.query)}</h2><p class="lead">Key takeaways</p>
    <ul class="pts ${pts.length>3?"twocol":""}">${pts.map(p=>`<li>${citeHtml(p,sources)}</li>`).join("")}</ul>
    ${images.length?`<div class="imgrow">${images.slice(0,8).map(u=>`<img class="zoom" src="${u}" onerror="this.style.display='none'">`).join("")}</div>`:""}</div>`);
  sources.forEach((s,i)=>{
    const img=images[i]||images[i%Math.max(1,images.length)];
    slides.push(`<div class="slide">
      ${img?`<img class="hero zoom" src="${img}" onerror="this.style.display='none'">`:""}
      <div class="kicker">Source ${i+1} of ${sources.length} · ${host(s.url)}</div>
      <h2>${esc(s.title)}</h2><p>${esc((s.content||"").slice(0,420))}…</p>
      <div class="callout">Why it matters: cited as [${i+1}] in the synthesized answer.</div>
      <a class="src" href="${s.url}" target="_blank" rel="noopener">Open source ↗</a></div>`);
  });
  slides.push(`<div class="slide"><div class="kicker">Tavily Search Tree</div><h2>Research map</h2>
    <div class="tree"><div class="root">🔎 ${esc(d.query)}</div>
      ${sources.map((s,i)=>`<div class="branch"><a href="${s.url}" target="_blank" rel="noopener">[${i+1}] ${esc(s.title)}</a><div class="u">${host(s.url)}</div></div>`).join("")}
    </div></div>`);

  $("#slides").innerHTML=slides.join("");
  $("#dots").innerHTML=slides.map(()=>`<div class="d"></div>`).join("");
  count=slides.length; idx=0; render();
  $("#deckph").classList.add("hidden");
  $("#deckwrap").classList.remove("hidden");
}
function render(){
  $("#slides").style.transform=`translateX(-${idx*100}%)`;
  $("#slides").scrollTop=0;
  [...$("#dots").children].forEach((d,i)=>d.classList.toggle("on",i===idx));
  $("#prev").disabled=idx===0; $("#next").disabled=idx===count-1;
}
// Clicking through slides requires sign-in.
function deckGated(){ if(signedIn())return false; openAuth(); return true; }
$("#prev").onclick=()=>{ if(deckGated())return; if(idx>0){idx--;render();} };
$("#next").onclick=()=>{ if(deckGated())return; if(idx<count-1){idx++;render();} };

function maximizeDeck(){ $("#deckwrap").classList.add("maximized"); $("#backdrop").classList.add("show"); }
function restoreDeck(){ $("#deckwrap").classList.remove("maximized"); $("#backdrop").classList.remove("show"); }
// Close expanded deck → if opened from a tile, return to the lander where we were.
function dismissDeck(){
  restoreDeck();
  if(cameFromTile){ cameFromTile=false; setView("lander", landerScrollY); }
}
$("#mxBtn").onclick=maximizeDeck;
$("#closeDeck").onclick=dismissDeck;
$("#backdrop").onclick=dismissDeck;

// ---- Lightbox ----
document.addEventListener("click",(e)=>{ if(e.target.matches("img.zoom")){ $("#lbImg").src=e.target.src; $("#lb").classList.add("on"); } });
$("#lb").onclick=()=>$("#lb").classList.remove("on");

document.addEventListener("keydown",(e)=>{
  if($("#lb").classList.contains("on")){ if(e.key==="Escape")$("#lb").classList.remove("on"); return; }
  if($("#deckwrap").classList.contains("maximized")){
    if(e.key==="Escape"){dismissDeck();return;}
  }
  if($("#deckwrap").classList.contains("hidden"))return;
  if(e.key==="ArrowLeft")$("#prev").click();
  else if(e.key==="ArrowRight")$("#next").click();
});

qEl.addEventListener("keydown",(e)=>{ if(e.key==="Enter")go.click(); });
renderHistory();
updateAuthUI();
</script>
</body>
</html>
